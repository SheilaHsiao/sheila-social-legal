<style>
  :root{
    --ink:#1b2430;--muted:#5b6673;--bg:#f6f3ee;--card:#fff;
    --brand:#0f2a3d;--accent:#d9a441;--line:#e6e0d6;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.75;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
  .wrap{max-width:720px;margin:0 auto;padding:0 20px}

  header.hero{background:var(--brand);color:#fff;padding:56px 0 40px;border-bottom:4px solid var(--accent)}
  .tag{display:inline-block;font-size:.8em;letter-spacing:.12em;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 12px;margin-bottom:16px}
  h1{font-size:2em;line-height:1.3;margin:0 0 .4em}
  h1 .en{color:var(--accent)}
  .sub{font-size:1.1em;margin:0;color:#dfe6ec}

  main{padding:32px 0 8px}
  h2{font-size:1.15em;margin:0 0 1em}
  .cards{display:grid;gap:14px;list-style:none;margin:0;padding:0}
  .card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:16px 18px}

  .card h3{font-size:1.1em;margin:.1em 0 .2em}
  .card p{margin:0;color:var(--muted);font-size:.95em}

  .cta{display:grid;gap:12px;margin:32px 0}
  .btn{display:block;text-align:center;text-decoration:none;font-weight:600;font-size:1.05em;border-radius:10px;padding:15px 20px;min-height:48px}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:active{background:#1a3d57}
  .btn-secondary{background:transparent;color:var(--brand);border:2px solid var(--brand)}
  .btn-secondary:active{background:#e9e4da}

  footer{margin-top:2em;color:#888;font-size:.85em;border-top:1px solid #ddd;padding:1em 0 2em}

  @media (min-width:600px){
    header.hero{padding:80px 0 56px}
    h1{font-size:2.4em}
    .cards{grid-template-columns:repeat(3,1fr)}
    .cta{grid-template-columns:1fr 1fr}
  }
</style>

<body>

<footer class="wrap">© 2026 高雄地皮百科 Nico</footer>

<script>
  // 把網址列的 utm_source / utm_medium / utm_campaign 原樣帶到按鈕連結
  (function(){
    var src=new URLSearchParams(location.search),keys=["utm_source","utm_medium","utm_campaign"];
    document.querySelectorAll("a.js-utm").forEach(function(a){
      var url=new URL(a.href);
      keys.forEach(function(k){if(src.has(k))url.searchParams.set(k,src.get(k));});
      a.href=url.toString();
    });
  })();
</script>
